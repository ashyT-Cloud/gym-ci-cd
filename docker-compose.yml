version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: gym-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: gym-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/gymdb

volumes:
  mongo-data:
